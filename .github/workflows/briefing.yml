# .github/workflows/briefing.yml
name: Morning Briefing

on:
  schedule:
    - cron: '47 5 * * *'      # UTC backup; primary trigger is the bounded Railway watchdog
  workflow_dispatch:          # Esecuzione manuale da GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: briefing_daily
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      already_run: ${{ steps.check_run.outputs.already_run }}
      content_ready: ${{ steps.check_run.outputs.content_ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check already run
        id: check_run
        run: pip install requests && python src/check_run.py

  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    if: needs.check.outputs.content_ready != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ffmpeg (for pydub)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: STEP 1 — Fetch sources
        if: needs.check.outputs.content_ready != 'true'
        run: python src/fetcher.py

      - name: STEP 1b — Fetch Market Data
        if: needs.check.outputs.content_ready != 'true'
        run: python src/market_fetcher.py
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: STEP 2 — AI Summarize
        if: needs.check.outputs.content_ready != 'true'
        run: python src/summarizer.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GROQ_API_KEY_NEWS: ${{ secrets.GROQ_API_KEY_NEWS }}
          GROQ_API_KEY_NEWS_2: ${{ secrets.GROQ_API_KEY_NEWS_2 }}

      - name: STEP 3a — Generate Audio (Piper TTS)
        if: needs.check.outputs.content_ready != 'true'
        run: |
          mkdir -p models
          # Download modelli da Hugging Face (Italiano + Inglese)
          if [ ! -f models/it_IT-paola-medium.onnx ]; then
            wget -q -O models/it_IT-paola-medium.onnx \
              "https://huggingface.co/rhasspy/piper-voices/resolve/main/it/it_IT/paola/medium/it_IT-paola-medium.onnx"
            wget -q -O models/it_IT-paola-medium.onnx.json \
              "https://huggingface.co/rhasspy/piper-voices/resolve/main/it/it_IT/paola/medium/it_IT-paola-medium.onnx.json"
          fi
          if [ ! -f models/en_US-amy-medium.onnx ]; then
            wget -q -O models/en_US-amy-medium.onnx \
              "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/amy/medium/en_US-amy-medium.onnx"
            wget -q -O models/en_US-amy-medium.onnx.json \
              "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/amy/medium/en_US-amy-medium.onnx.json"
          fi
          python src/tts.py
          # Verifica che l'audio sia stato generato
          python src/check_run.py

      - name: STEP 3d — Update GitHub Pages
        run: python src/site_generator.py

      - name: STEP 3e — Archive Data
        run: python src/archiver.py

      - name: STEP 4 — Commit & Push changes (Local)
        run: |
          git config --global user.name 'vinciber'
          git config --global user.email 'vinciberlr@gmail.com'

          git add docs/ data/
          if ! git diff --cached --quiet; then
            git commit -m "briefing: $(date +%Y-%m-%d)"
          fi
          git fetch origin main
          git rebase origin/main
          git push origin main

      - name: STEP 5 — Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [check, briefing]
    if: >-
      needs.check.outputs.content_ready != 'true' &&
      needs.briefing.result == 'success'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [check, briefing, deploy]
    if: >-
      always() && needs.check.result == 'success' &&
      (needs.check.outputs.content_ready == 'true' ||
      (needs.briefing.result == 'success' && needs.deploy.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests python-dotenv
      # Publication is the delivery gate for the briefing itself. Telegram is
      # retried by the bounded watchdog, so a transient notification failure
      # must not turn a successfully published briefing into a failed workflow.
      - name: Verify publication and deliver once (best effort)
        id: telegram_delivery
        continue-on-error: true
        run: python src/telegram_bot.py --send --published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Report pending Telegram retry
        if: steps.telegram_delivery.outcome == 'failure'
        run: |
          echo "::warning title=Telegram delivery pending::The Morning Briefing was published. The Railway watchdog will retry Telegram delivery during its bounded morning window."
          {
            echo '### Telegram delivery pending'
            echo 'The Morning Briefing and GitHub Pages deployment succeeded; only Telegram delivery failed.'
            echo 'The bounded Railway watchdog will retry delivery. Inspect this step for the concrete error.'
          } >> "$GITHUB_STEP_SUMMARY"
