# .github/workflows/briefing.yml
name: Morning Briefing

on:
  schedule:
    - cron: '47 5 * * *'      # 07:47 CEST ogni giorno — orario non congestionato per assorbire delay GH Actions, consegna ~08:00-08:30 CEST
  workflow_dispatch:          # Esecuzione manuale da GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ffmpeg (for pydub)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: STEP 1 — Fetch sources
        run: python src/fetcher.py

      - name: STEP 1b — Fetch Market Data
        run: python src/market_fetcher.py
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: STEP 2 — AI Summarize
        run: python src/summarizer.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GROQ_API_KEY_NEWS: ${{ secrets.GROQ_API_KEY_NEWS }}
          GROQ_API_KEY_NEWS_2: ${{ secrets.GROQ_API_KEY_NEWS_2 }}

      - name: STEP 3a — Generate Audio (Piper TTS)
        run: |
          mkdir -p models
          # Download modelli da Hugging Face (Italiano + Inglese)
          if [ ! -f models/it_IT-paola-medium.onnx ]; then
            wget -q -O models/it_IT-paola-medium.onnx \
              "https://huggingface.co/rhasspy/piper-voices/resolve/main/it/it_IT/paola/medium/it_IT-paola-medium.onnx"
            wget -q -O models/it_IT-paola-medium.onnx.json \
              "https://huggingface.co/rhasspy/piper-voices/resolve/main/it/it_IT/paola/medium/it_IT-paola-medium.onnx.json"
          fi
          if [ ! -f models/en_US-amy-medium.onnx ]; then
            wget -q -O models/en_US-amy-medium.onnx \
              "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/amy/medium/en_US-amy-medium.onnx"
            wget -q -O models/en_US-amy-medium.onnx.json \
              "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/amy/medium/en_US-amy-medium.onnx.json"
          fi
          python src/tts.py
          # Verifica che l'audio sia stato generato
          ls docs/audio/*.mp3 && echo "✅ Audio generato" || echo "⚠️ Nessun file audio"
        continue-on-error: true

#      - name: STEP 3b — Send Email
#        run: python src/email_sender.py
#        continue-on-error: true
#        env:
#          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
#          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}

      - name: STEP 3c — Telegram
        run: python src/telegram_bot.py
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: STEP 3d — Update GitHub Pages
        run: python src/site_generator.py

      - name: STEP 3e — Archive Data
        run: python src/archiver.py

      - name: STEP 4 — Commit & Push changes (Local)
        run: |
          git config --global user.name 'vinciber'
          git config --global user.email 'vinciberlr@gmail.com'

          git add docs/ data/
          git commit -m "briefing: $(date +%Y-%m-%d)" || exit 0
          git fetch origin main
          git rebase origin/main -X theirs || (git rebase --abort && git pull --rebase origin main -X theirs)
          git push origin main

      - name: STEP 5 — Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: briefing
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
